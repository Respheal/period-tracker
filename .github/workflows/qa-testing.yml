name: API Quality Control

defaults:
  run:
    shell: bash
    working-directory: ./backend

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect Backend Python Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check for Python changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            python:
              - 'backend/api/**/*.py'
              - 'backend/poetry.lock'
              - 'backend/pyproject.toml'

  lint:
    name: Linting
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Run Tox (lint)
        run: poetry run tox -e lint

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Run Tox (security)
        run: poetry run tox -e security

  pytest:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Run Tox (test)
        run: poetry run tox -e test
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ./junit.xml

  all-checks-passed:
    name: Validate QA Checks
    # No checkout so set the working directory to just .
    defaults:
      run:
        working-directory: .
    runs-on: ubuntu-latest
    needs: [changes, lint, security, pytest]
    if: always()
    steps:
      - name: All checks passed
        run: |
          # Fail if any QA test failed or was cancelled
          if [[ "${{ needs.lint.result }}" != "success" ]] || [[ "${{ needs.security.result }}" != "success" ]] || [[ "${{ needs.pytest.result }}" != "success" ]]; then
            exit 1
          fi
          echo "All QA checks passed successfully."
