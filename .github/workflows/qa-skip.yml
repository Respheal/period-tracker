name: Skip Python QA Tests
# Bypass Python QA tests when the pull request doesn't modify backend code

defaults:
  run:
    shell: bash
    working-directory: ./backend

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "backend/api/**/*.py"
      - "backend/poetry.lock"
      - "backend/pyproject.toml"
  push:
    branches: ["main"]

permissions: {}

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Pass through
        run: echo "Skipping linting for this PR"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Pass through
        run: echo "Skipping security scan for this PR"

  pytest:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Pass through
        run: echo "Skipping unit tests for this PR"
