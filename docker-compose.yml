services:
  frontend:
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
  backend:
    container_name: backend
    command: >-
      bash -c "bash scripts/prestart.sh &&
      uvicorn api.main:app --host 0.0.0.0 --port 5000 --reload"
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - DATA_DIR=/data/
      - REDIS_HOST=redis
      - ALGORITHM=RS256
      - PRIVATE_KEY_PATH=/keys/private.pem
      - PUBLIC_KEY_PATH=/keys/public.pem
    volumes:
      - db-data:/data
  redis:
    image: redis

volumes:
  db-data:
